  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163640" transform="translate(539.136 478.483594)">Vertical boundaries are a storage idealization.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163640" transform="translate(539.136 491.297063)">Side slopes, freeboard, structural walls, tailwater,</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163640" transform="translate(539.136 504.110531)">and a physical spillway have not been designed.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163640" transform="translate(539.136 516.924)">Overflow is an accounting boundary only.</text>
  </g>
